<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Endless Archive</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050910;color:#dce8f2;font-family:system-ui,sans-serif}
#boot{height:100%;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="boot">GAME DATA LOADING…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./game_code',{cache:'no-store'});
    if(!response.ok)throw new Error(`game_code load failed: ${response.status}`);

    const raw=await response.text();
    const assetHead=`
<link rel="stylesheet" href="./assets/styles/visual-upgrade.css">
<link rel="stylesheet" href="./assets/styles/battle-cinematic.css">
<script src="./asset-config.js"><\/script>
<script src="./assets/runtime-assets.js"><\/script>
`;
    const html=/<\/head>/i.test(raw)
      ? raw.replace(/<\/head>/i,`${assetHead}</head>`)
      : `${assetHead}${raw}`;

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML=`게임 로드 실패<br><small>${String(err.message||err)}</small>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
