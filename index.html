<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Endless Archive</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050910;color:#dce8f2;font-family:system-ui,sans-serif}
#boot{height:100%;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="boot">GAME DATA LOADING…</div>
<script>
(async()=>{
  try{
    const noStore={cache:'no-store'};
    const [gameRes,visualRes,cinematicRes,identityRes,configRes,runtimeRes]=await Promise.all([
      fetch('./game_code',noStore),
      fetch('./assets/styles/visual-upgrade.css',noStore),
      fetch('./assets/styles/battle-cinematic.css',noStore),
      fetch('./assets/styles/battle-identity.css',noStore),
      fetch('./asset-config.js',noStore),
      fetch('./assets/runtime-assets.js',noStore)
    ]);

    const required=[gameRes,visualRes,cinematicRes,identityRes,configRes,runtimeRes];
    const failed=required.find(r=>!r.ok);
    if(failed)throw new Error(`asset load failed: ${failed.url} (${failed.status})`);

    const [raw,visualCss,cinematicCss,identityCss,configJs,runtimeJs]=await Promise.all([
      gameRes.text(),visualRes.text(),cinematicRes.text(),identityRes.text(),configRes.text(),runtimeRes.text()
    ]);

    const injected=`
<style id="external-visual-upgrade">${visualCss}<\/style>
<style id="external-battle-cinematic">${cinematicCss}<\/style>
<style id="external-battle-identity">${identityCss}<\/style>
<script>${configJs}<\/script>
<script>${runtimeJs}<\/script>
<link rel="stylesheet" href="./assets/styles/subculture-3d.css?v=anime-v4">
<script type="module" src="./assets/subculture-3d.js?v=anime-v4"><\/script>
`;

    const html=/<\/head>/i.test(raw)
      ? raw.replace(/<\/head>/i,`${injected}</head>`)
      : `${injected}${raw}`;

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML=`게임 로드 실패<br><small>${String(err.message||err)}</small>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
