<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Endless Archive</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050910;color:#dce8f2;font-family:system-ui,sans-serif}
#boot{height:100%;display:grid;place-items:center;font-size:14px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="boot">GAME DATA LOADING…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./game_code',{cache:'no-store'});
    if(!response.ok)throw new Error(`game_code load failed: ${response.status}`);
    let html=await response.text();
    const hook=`
<script src="./attack_vfx.js"><\/script>
<script>
(() => {
  if(typeof VFX==='undefined' || !VFX || typeof VFX.event!=='function') return;
  const originalEvent=VFX.event.bind(VFX);
  VFX.event=function(type,target,amount,opt={}){
    const result=originalEvent(type,target,amount,opt);
    if(type==='damage' && window.AttackVFX){
      window.AttackVFX.impact(target,{crit:!!opt.crit,dot:!!opt.dot,groggy:!!(target&&target.staggered)});
    }
    return result;
  };
})();
<\/script>`;
    if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,hook+'\n</body>');
    else html+=hook;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML=`게임 로드 실패<br><small>${String(err.message||err)}</small>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
