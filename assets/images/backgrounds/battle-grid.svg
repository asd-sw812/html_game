    <stop offset="1" stop-color="#100406"/>
  </linearGradient>
  <radialGradient id="sun"><stop stop-color="#ffcf6a" stop-opacity=".42"/><stop offset=".36" stop-color="#ff6b35" stop-opacity=".2"/><stop offset="1" stop-color="#ff3d2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="bossGlow"><stop stop-color="#ff6a4c" stop-opacity=".34"/><stop offset="1" stop-color="#ff3140" stop-opacity="0"/></radialGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb25b" stop-opacity="0"/><stop offset=".45" stop-color="#ff8a45" stop-opacity=".54"/><stop offset=".7" stop-color="#ff4f45" stop-opacity=".18"/><stop offset="1" stop-color="#ff4f45" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
